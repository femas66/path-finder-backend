services:
  postgres:
    image: postgres:16-alpine
    container_name: path_finder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-path_finder_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - path_finder_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: path_finder_backend
    restart: unless-stopped
    environment:
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET before starting backend}"
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-path_finder_db}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - path_finder_network

volumes:
  postgres_data:
    driver: local

networks:
  path_finder_network:
    driver: bridge
